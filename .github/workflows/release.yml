name: Release

# The org release pipeline (swarm-routing/.github reusable-release.yml;
# CONTRIBUTING "Cutting a release" there), epic #6:
#   dispatch `dry-run`  bump, build, attest and verify on the runner only;
#   dispatch `bump`     open the PR `chore(release): bump version A to B`
#                       from bot/release (Commitizen, .cz.toml);
#   dispatch `publish`  with `sha`: release a bump that already merged (a push
#                       whose release never ran, swarm-routing/.github#943);
#   merge that PR       the release: `make dist` builds and checks the asset
#                       (swarm-core-<ver>.tar.gz, the ns-3 module;
#                       tools/release/dist.sh), then
#                       SBOM, checksums, signed provenance, the v<ver> tag and
#                       the GitHub release.
# The `image` job then publishes ghcr.io/swarm-routing/swarm-adapter-ns3:v<ver>-{optimized,debug}
# (named after the repository, swarm-routing/.github#370; v0.3.0 to v1.0.0 are in
# ns3-swarm-core and v0.1.0, v0.2.0 in ns3-swarm-core-ns3, both deprecated and
# frozen, deleted once the swarm-core migration completes: #255)
# with the module built in (CONTRIBUTING "Images"). The `swarm-core` vcpkg
# port follows swarm-routing/swarm-core's releases, not this module's (#231);
# this module's port is `swarm-adapter-ns3` (on the ns3 and swarm-core ports,
# swarm-routing/vcpkg-registry#76): `vcpkg-ports` opens its bump PR in
# swarm-routing/vcpkg-registry after each release (swarm-routing/.github#439).
# A dry run also builds and tests swarm-core's consumers (the four protocols
# and AntHocNet, .github/downstream.txt) against the commit, report-only
# (`downstream-consumers`, swarm-routing/.github#482).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: bump, build, attest and verify on the runner only; bump: open the bump PR (merging it releases); release-notes: re-render the notes of the release `tag` from CHANGELOG.md; publish: release the already-merged bump commit `sha` (swarm-routing/.github#943)"
        type: choice
        options: [dry-run, bump, release-notes, publish]
        default: dry-run
      increment:
        description: "auto: the bump Commitizen reads from the commits; PATCH, MINOR or MAJOR force it (MAJOR releases 1.0.0, docs/api-policy.md \"Freezing\")"
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]
        default: auto
      tag:
        description: "release-notes only: the existing release whose notes are re-rendered, vX.Y.Z (swarm-routing/.github#524)"
        type: string
        default: ''
      sha:
        description: "publish only: the full SHA of the merged bump commit to release (swarm-routing/.github#943)"
        type: string
        default: ''
  push:
    branches: [main]   # the merged bump PR releases; any other push is a no-op
permissions:
  contents: read
# One run per commit at a time, never cancelled (a later run must not replace
# a merged bump's pending release).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    # Saves a runner on ordinary pushes; the workflow itself checks the PR.
    # Any commit of the push may be the bump (a merge queue batches them).
    if: "${{ github.event_name != 'push' || contains(toJSON(github.event.commits.*.message), 'chore(release): bump version ') }}"
    permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-release.yml@3a6638192e29fce4418eb76a6187d5c5537891a3 # main@2026-11-27
    with:
      mode: ${{ inputs.mode }}   # empty on push: release
      increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}  # '' on push and for auto (swarm-routing/.github#211)
      tag: ${{ inputs.tag }}   # release-notes only; '' on push (swarm-routing/.github#524)
      sha: ${{ inputs.sha }}   # publish only; '' on push (swarm-routing/.github#943)
      # a dry run builds the protocols and AntHocNet against this commit,
      # report-only (.github/downstream.txt, swarm-routing/.github#482)
      downstream-consumers: .github/downstream.txt
      # the module's vcpkg port, bumped from each release (swarm-routing/.github#881)
      vcpkg-ports: swarm-adapter-ns3
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}

  image:
    needs: release
    # a manual `publish` releases too, so it builds the image as well
    if: ${{ needs.release.outputs.mode == 'release' || needs.release.outputs.mode == 'publish' }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@3a6638192e29fce4418eb76a6187d5c5537891a3 # main@2026-11-27
    with:
      modules: swarm-core=.
      image: swarm-adapter-ns3
      tag: ${{ needs.release.outputs.tag }}
