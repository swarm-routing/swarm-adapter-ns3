name: CI

# The swarm-core module in ghcr.io/swarm-routing/ns3-dev (debug and sanitized,
# the release ns-3 supports), with every org quality gate on from the first
# PR (swarm-routing/.github#35): strict warnings, coverage (report-only, to Codecov), SonarQube Cloud,
# determinism, clang-format and licence headers.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: JSON list of image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48)'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only pull request or merge group (swarm-routing/.github#581): the
  # jobs below that need this one skip their steps and still report. Its
  # pattern leaves out docs/api-surface.txt, which api-surface.yml checks.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: swarm-routing/.github/.github/actions/changes@10d9057fc3bcd21f39be701885929db4c056e6f8 # main@2026-11-25
        id: changes
        timeout-minutes: 2
        with:
          paths: '\.md$|^docs/references\.bib$|^\.github/ISSUE_TEMPLATE/|^\.github/(CODEOWNERS|FUNDING\.yml|pull_request_template\.md)$|^LICENSE[^/]*$|^CITATION\.cff$|^\.coderabbit\.yaml$|^\.bestpractices\.json$|^\.github/org-sync\.lock$'

  python-quality:
    # ruff (org ruff.toml) + the tools/ scripts' self-tests under coverage,
    # report-only; keeps the `python-coverage` artifact the `ci` scan imports,
    # so SonarQube Cloud measures check-api-surface.py and check-cxx-standard.py
    # by their self-tests (swarm-routing/.github#425).
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@10d9057fc3bcd21f39be701885929db4c056e6f8 # main@2026-11-25
    with:
      paths: tools
      tests: tools/checks/tests/test_*.py
      source: tools

  ci:
    # After the Python job, whose coverage the scan imports; a ruff finding
    # there must not stop the ns-3 build (the scan then warns: C++ coverage only).
    needs: python-quality
    if: ${{ !cancelled() }}
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@10d9057fc3bcd21f39be701885929db4c056e6f8 # main@2026-11-25
    with:
      modules: swarm-core=.
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      # Automatic runs: both CI profiles of `latest`. A manual run on older
      # releases defaults to debug, the profile every published release has.
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Strict warnings and coverage need an image whose ns3-build-contrib has the
      # options; on-demand older releases may predate them, so they run on the
      # automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      # SonarQube Cloud CI analysis with that coverage (swarm-routing/.github
      # CONTRIBUTING § Quality gates); skipped on fork PRs (no token) and while
      # the project is on Automatic Analysis.
      sonar: ${{ inputs.ns3-versions == '' }}
      # gcov's exception-edge branches (and those gcovr judges unreachable)
      # are not counted: they made 4303 conditions of 2247 new lines
      # (swarm-routing/.github#425, decision of 2026-11-15).
      coverage-branch-filter: true
      # coverage.py's report of tools/ (the `python-quality` job) into the same analysis.
      sonar-python-coverage: python-coverage
      determinism: swarm-core-seed --seed={seed}
      # tools/ is the one dual-licensed root: swarm-core's core/ is no longer
      # here but in swarm-routing/swarm-core's release (#231), so no core root
      # and no core dependency to check includes against.
      dual-roots: 'tools/'
      core-roots: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The swarm-core release this module builds on (swarm-core.lock, #231)
  # keeps up with the C++ standard of the ns-3 release the module supports
  # (docs/api-policy.md "C++ standard", #141): its core/CMakeLists.txt's
  # CMAKE_CXX_STANDARD and the cxx_std_ feature every module linking
  # ${libswarm-core} inherits, against the CMAKE_CXX_STANDARD_MINIMUM of the
  # image the `ci` job builds in. Fails when ns-3 raises its minimum and the
  # locked swarm-core release has not followed (a newer one, then a lock bump).
  cxx-standard:
    needs: changes
    # a failed `changes` job runs every step rather than skip a required check
    if: ${{ !cancelled() && inputs.ns3-versions == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # no image on a docs-only change: the steps skip on the bare runner
    container:
      image: ${{ needs.changes.outputs.docs-only != 'true' && 'ghcr.io/swarm-routing/ns3-dev:latest-debug' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: Self-test
        if: needs.changes.outputs.docs-only != 'true'
        run: python3 -I tools/checks/check-cxx-standard.py --self-test
      - name: The locked swarm-core release's core/ against the image's ns-3
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 3
        shell: bash  # a container step defaults to sh, which has no pipefail
        run: |
          set -euo pipefail
          v() { sed -nE "s/^SWARM_CORE_$1=(.*)$/\1/p" swarm-core.lock; }
          mkdir -p "$RUNNER_TEMP/swarm-core"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$RUNNER_TEMP/$(v ASSET)" \
            "https://github.com/$(v REPO)/releases/download/$(v TAG)/$(v ASSET)"
          echo "$(v SHA256)  $RUNNER_TEMP/$(v ASSET)" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$(v ASSET)" -C "$RUNNER_TEMP/swarm-core"
          python3 -I tools/checks/check-cxx-standard.py --ns3 /opt/ns-3 "$RUNNER_TEMP"/swarm-core/*/core/CMakeLists.txt

  # Golden rule 12: the protocols build against this module. Each consumer's
  # `main` is built on this change and its test.py suite run, so a change that
  # breaks one shows on its own PR instead of in the consumers' weekly canary
  # legs (as #258's removal of core/ did). Report-only: a consumer's own red
  # `main` never blocks this repository, so the job is not a required check and
  # continues on error. AntHocNet installs through its own `make install-ns3`
  # (SWARM_CORE_MODULE names this checkout, swarm-routing/AntHocNet#1209); the
  # others link their ns3/ as the module.
  consumers:
    needs: changes
    if: ${{ !cancelled() && inputs.ns3-versions == '' && needs.changes.outputs.docs-only != 'true' }}
    name: consumer / ${{ matrix.repo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: ghcr.io/swarm-routing/ns3-dev:latest-debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: AntHocNet, module: anthocnet }
          - { repo: ARA, module: ara }
          - { repo: BeeAdHoc, module: beeadhoc }
          - { repo: HOPNET, module: hopnet }
          - { repo: Termite, module: termite }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: swarm-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/${{ matrix.repo }}
          ref: main
          path: consumer
          persist-credentials: false
      - name: Build the consumer on this change and run its suite
        timeout-minutes: 25
        shell: bash  # a container step defaults to sh, which has no pipefail
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          ws=$GITHUB_WORKSPACE
          if [ "$MODULE" = anthocnet ]; then
            mkdir -p "$RUNNER_TEMP/ns3/contrib"
            SWARM_CORE_MODULE="$ws/swarm-core" make -C consumer install-ns3 NS3DIR="$RUNNER_TEMP/ns3" BASELINES=0
            ns3-build-contrib --suite anthocnet "swarm-core=$RUNNER_TEMP/ns3/contrib/swarm-core" \
              "anthocnet=$RUNNER_TEMP/ns3/contrib/anthocnet"
          else
            ns3-build-contrib --test "swarm-core=$ws/swarm-core" "$MODULE=$ws/consumer/ns3"
          fi

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC,
  # no Codecov token).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@10d9057fc3bcd21f39be701885929db4c056e6f8 # main@2026-11-25
