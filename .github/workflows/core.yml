name: Core

# swarm-core's core/ is no longer in this repository: the module builds on the
# swarm-routing/swarm-core release swarm-core.lock names (#231), where core/
# is built, tested and sanitized alone. This check verifies the lock against
# that release (swarm-routing/.github tools/checks/release_lock.py verify: the
# tag names the commit, the version is the tag's, the SHA256 is the asset's in
# the release's SHA256SUMS), so the tarball CMakeLists.txt fetches is the
# release's. The check name is `core`, a required check; no `paths:` filter,
# as a required check runs on every PR.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          ref: 377fb5a73ca3c6864aee726a15eeef796270e5bc  # main@2026-11-23
          path: .org
          sparse-checkout: tools/checks
          persist-credentials: false
      - name: swarm-core.lock names the swarm-core release, verified
        timeout-minutes: 2
        run: python3 -I .org/tools/checks/release_lock.py verify swarm-core.lock
