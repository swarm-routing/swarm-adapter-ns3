# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#531)
bestpractices_project = "16816"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24138628"
title = "swarm-adapter-ns3"
module = "swarm-core"
# the C++ badge: the standard of the ns-3 release swarm-core supports, which swarm::core gives this module (#141, #231)
cxx = "23"
dual = ["tools/"]
trust_boundary = """
The bounds-checked little-endian readers (org invariant 3) are
swarm-routing/swarm-core's (`WireReader`, `VisitedPath::read`; its
SECURITY.md), at the release `swarm-core.lock` names (#231), whose tarball the
build checks by SHA256. Here, `ReadWireBytes` (`model/swarm-wire-buffer.h`)
copies a packet's bytes out of an ns-3 `Buffer` for those readers and never
reads past the buffer's size. Everything above them (each protocol's header
layout and routing decisions) belongs to each protocol."""
limitations = """
- No authentication or integrity on anything: a simulation library, not a
  network stack for real radios.
- Releases are 0.x (v0.1.0 on): the API may change in any minor release;
  `kSwarmCoreApiVersion` names the API a build has. Downstream protocols
  build against `main` or pin a release."""
verifying = """
Releases from v0.1.0 on (epic #6) are built, signed and published by the
org's release workflow (`swarm-routing/.github` `reusable-release.yml`,
called by `.github/workflows/release.yml`). Each carries
`swarm-core-X.Y.Z.tar.gz` (the module, for ns-3's `contrib/`; up to v1.0.0
with the dual-licensed `core/`, after it with `swarm-core.lock`, the
swarm-routing/swarm-core release it builds on), `SHA256SUMS`, a CycloneDX SBOM
(`ns3-swarm-core-X.Y.Z.cdx.json`) and signed SLSA build provenance for every
asset (`ns3-swarm-core-X.Y.Z.intoto.jsonl`, and the Sigstore bundle
`ns3-swarm-core-X.Y.Z.sigstore.json` for offline checks). The workflow runs
these checks itself before it publishes, and first builds the tarball in a
clean `ns3-dev` tree and runs `test.py -s swarm-core` (up to v1.0.0 it also
built and tested `core/` alone), so a release that fails any of them never
goes out. With the
[GitHub CLI](https://cli.github.com/):

```bash
sha256sum -c SHA256SUMS --ignore-missing
gh attestation verify swarm-core-X.Y.Z.tar.gz --repo swarm-routing/ns3-swarm-core \\
  --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
gh attestation verify swarm-core-X.Y.Z.tar.gz --repo swarm-routing/ns3-swarm-core \\
  --predicate-type https://cyclonedx.org/bom
gh attestation trusted-root > trusted_root.jsonl   # once, while online
gh attestation verify swarm-core-X.Y.Z.tar.gz --repo swarm-routing/ns3-swarm-core \\
  --bundle ns3-swarm-core-X.Y.Z.sigstore.json --custom-trusted-root trusted_root.jsonl   # offline
```

The signer is the org's reusable workflow; this repository is in the
certificate's workflow-repository extension. Each release after v1.0.0 also
publishes the image `ghcr.io/swarm-routing/swarm-adapter-ns3:vX.Y.Z-optimized`
and `-debug` (v0.3.0 to v1.0.0: `ghcr.io/swarm-routing/ns3-swarm-core`; v0.1.0
and v0.2.0: `ghcr.io/swarm-routing/ns3-swarm-core-ns3`; both deprecated and
frozen, deleted once the swarm-core migration completes, #255), the module
built on a pinned `ns3-dev` digest, signed with cosign
(keyless): see `swarm-routing/.github` `reusable-ns3-image.yml` for its
verify commands."""
[make]
build = 'docker run --rm -v "$(CURDIR):/src/swarm-core:ro" $(NS3_IMAGE) ns3-build-contrib swarm-core=/src/swarm-core'
test = 'docker run --rm -v "$(CURDIR):/src/swarm-core:ro" $(NS3_IMAGE) ns3-build-contrib --strict-warnings --test swarm-core=/src/swarm-core'


[docs]
# the project page keeps its id on the site until the site follows the rename
# (swarm-routing/swarm-routing.github.io#234; swarm-routing/.github#672)
arena_id = "ns3-swarm-core"
[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "swarm-adapter-ns3, the ns-3 adapter of swarm-core's ports: the ns-3 contrib module (still named swarm-core) every swarm-routing protocol links against, SwarmRoutingBase, link monitors, energy hook and deferred queue, on swarm-routing/swarm-core's C++23 primitives."
homepage = "https://swarm-routing.github.io/projects/ns3-swarm-core/"
topics = ["ns-3", "swarm-intelligence", "routing-protocol", "manet", "cpp23", "pheromone", "network-simulation", "library", "ports-and-adapters"]
ruleset = "protocol"
required_checks = ["ci / ns-latest debug", "ci / ns-latest sanitized", "ci / format", "ci / headers / licence", "core", "cxx-standard", "check / org-sync", "title / title", "review / coderabbit", "api-surface"]
# api-surface: the API record (docs/api-surface.txt) is current and nothing in it is removed or
# changed without a breaking mark (#83); required from the v1.0.0 freeze. Applies when
# swarm-routing/.github's repo-settings is dispatched with mode apply after this merges.
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
# Off for now (maintainer decision 2026-11-11): `false` strips the `release` environment's
# required reviewer and wait timer, so release.yml's publish job no longer waits for an
# approval. `true` turns the gate back on (swarm-routing/.github CONTRIBUTING "Automation").
release_environment = false
