<!-- swarm-core ns-3 App Store icon: a small network whose one route is
     reinforced as a pheromone trail. Hand-authored, no text or fonts.
     Render: rsvg-convert -w 100 -h 100 icon.svg -o icon-100.png
     (or cairosvg icon.svg -W 100 -H 100 -o icon-100.png) -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- links -->
  <g stroke="#5B6B7A" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="18" y1="76" x2="30" y2="30"/>
    <line x1="30" y1="30" x2="52" y2="54"/>
    <line x1="30" y1="30" x2="58" y2="16"/>
    <line x1="58" y1="16" x2="82" y2="24"/>
    <line x1="52" y1="54" x2="78" y2="80"/>
    <line x1="78" y1="80" x2="82" y2="24"/>
  </g>
  <!-- pheromone trail: source -> relay -> destination -->
  <polyline points="18,76 52,54 82,24" stroke="#E8A317" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- nodes -->
  <g fill="#2E3A46">
    <circle cx="30" cy="30" r="7"/>
    <circle cx="58" cy="16" r="6"/>
    <circle cx="78" cy="80" r="6"/>
    <circle cx="52" cy="54" r="8"/>
  </g>
  <!-- trail endpoints -->
  <g fill="#E8A317" stroke="#2E3A46" stroke-width="3">
    <circle cx="18" cy="76" r="9"/>
    <circle cx="82" cy="24" r="9"/>
  </g>
  <!-- the relay on the trail -->
  <circle cx="52" cy="54" r="3.5" fill="#E8A317"/>
</svg>
